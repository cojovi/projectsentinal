<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="310" viewBox="0 0 1280 310" role="img"><title>Project Sentinal component flow</title><rect x="0" y="0" width="1280" height="310" rx="12" fill="#080C14" stroke="none"/><text x="34" y="38" fill="#00DFFF" font-family="monospace" font-size="13" font-weight="400" letter-spacing="1">TRACE THE SIGNAL / PROJECT SENTINAL</text><rect x="34" y="78" width="380" height="165" rx="8" fill="#0E1624" stroke="#26364C"/><rect x="35" y="79" width="378" height="3" rx="0" fill="#91A4BA" stroke="none"/><text x="52" y="111" fill="#91A4BA" font-family="monospace" font-size="11" font-weight="400" letter-spacing=".7">01 / SOURCE</text><text x="52" y="154" fill="#F2F6FC" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" >Reviewed posts</text><text x="52" y="192" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Markdown and site settings in the blog</text><text x="52" y="214" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >workspace.</text><rect x="450" y="78" width="380" height="165" rx="8" fill="#0E1624" stroke="#26364C"/><rect x="451" y="79" width="378" height="3" rx="0" fill="#00DFFF" stroke="none"/><text x="468" y="111" fill="#00DFFF" font-family="monospace" font-size="11" font-weight="400" letter-spacing=".7">02 / GENERATE</text><text x="468" y="154" fill="#F2F6FC" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" >Hexo + Aurora</text><text x="468" y="192" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Theme rendering and the local social-</text><text x="468" y="214" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >metadata filter.</text><rect x="866" y="78" width="380" height="165" rx="8" fill="#0E1624" stroke="#26364C"/><rect x="867" y="79" width="378" height="3" rx="0" fill="#FF00CC" stroke="none"/><text x="884" y="111" fill="#FF00CC" font-family="monospace" font-size="11" font-weight="400" letter-spacing=".7">03 / OUTPUT</text><text x="884" y="154" fill="#F2F6FC" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" >Static publication</text><text x="884" y="192" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >Configured pages, feeds, and sitemaps;</text><text x="884" y="214" fill="#91A4BA" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" >deployment is separate.</text><path d="M414 160 L444 160" fill="none" stroke="#00DFFF" stroke-width="2"/><path d="M438 155l6 5-6 5" fill="none" stroke="#00DFFF" stroke-width="2"/><path d="M830 160 L860 160" fill="none" stroke="#00DFFF" stroke-width="2"/><path d="M854 155l6 5-6 5" fill="none" stroke="#00DFFF" stroke-width="2"/><text x="34" y="282" fill="#91A4BA" font-family="monospace" font-size="11" font-weight="400" letter-spacing="1">PROJECT ARCHITECTURE / SCHEMATIC — NOT A LIVE STATUS DISPLAY</text></svg>
